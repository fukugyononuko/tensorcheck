.axis{stroke:#52514e} .grid{stroke:#e4e3df}
  @media (prefers-color-scheme: dark) {
  .st-surface{stroke:#1a1a19} .fi-surface{fill:#1a1a19}
.st-ink{stroke:#f0efec} .fi-ink{fill:#f0efec}
