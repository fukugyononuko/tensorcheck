<rect width="640" height="480" class="fi-surface"/>
<text class="title" x="72" y="28">Curvature of Schwarzschild spacetime</text>
<text x="72" y="50">R_ab = 0 everywhere (vacuum), yet K = R_abcd R^abcd ≠ 0</text>
