<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480" role="img" aria-label="Curvature of Schwarzschild spacetime">
<title>Curvature of Schwarzschild spacetime</title><desc>Kretschmann scalar computed from the metric tensor by automatic differentiation, against the exact 12 r_s^2 / r^6.</desc>
