[workspace]
members = ["crates/tensorcheck", "crates/tensorcheck-numerics"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/fukugyononuko/tensorcheck"
# Published on GitHub only for now (not on crates.io).
publish = false

[profile.release]
codegen-units = 1
lto = "thin"

[profile.bench]
codegen-units = 1
lto = "thin"
